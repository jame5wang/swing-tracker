<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詹姆5王的股市觀測站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<script>
(function(){
  try{
    var saved=localStorage.getItem('swingTrackerTheme');
    document.documentElement.setAttribute('data-theme', saved==='light' ? 'light' : 'dark');
  }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }
})();
</script>
<style>
:root{
  --bg:#f4f5f7; --bg2:#eceef2; --panel:#ffffff; --panel2:#eef0f4; --line:#dde1e8;
  --ink:#12151c; --sub:#5b6373; --mute:#98a0b0;
  --accent:#0b6ecb; --accent2:#0891a8;
  --buy:#0e8f6a; --buyBg:#e2f5ee;
  --sell:#b06a00; --sellBg:#fbedd8;
  --stop:#c62b3f; --stopBg:#fbe4e6;
  --hold:#3a5a9c; --holdBg:#e8edf9;
  --deep:#7c3aed; --deepBg:#f1e9fe;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --glow:none;
  --headerGrad:linear-gradient(90deg, var(--accent), var(--accent2));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e16; --bg2:#0d1220; --panel:#111726; --panel2:#161d2e; --line:#232c42;
    --ink:#eaeef8; --sub:#8a93ab; --mute:#525d78;
    --accent:#3ba7ff; --accent2:#22d3c5;
    --buy:#2be3a6; --buyBg:rgba(43,227,166,.12);
    --sell:#ffb648; --sellBg:rgba(255,182,72,.12);
    --stop:#ff5470; --stopBg:rgba(255,84,112,.14);
    --hold:#6fa8ff; --holdBg:rgba(111,168,255,.12);
    --deep:#c084fc; --deepBg:rgba(192,132,252,.14);
    --glow:0 0 0 1px rgba(59,167,255,.08), 0 2px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e16; --bg2:#0d1220; --panel:#111726; --panel2:#161d2e; --line:#232c42;
  --ink:#eaeef8; --sub:#8a93ab; --mute:#525d78;
  --accent:#3ba7ff; --accent2:#22d3c5;
  --buy:#2be3a6; --buyBg:rgba(43,227,166,.12);
  --sell:#ffb648; --sellBg:rgba(255,182,72,.12);
  --stop:#ff5470; --stopBg:rgba(255,84,112,.14);
  --hold:#6fa8ff; --holdBg:rgba(111,168,255,.12);
  --deep:#c084fc; --deepBg:rgba(192,132,252,.14);
  --glow:0 0 0 1px rgba(59,167,255,.08), 0 2px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); background-image:radial-gradient(ellipse 900px 500px at 50% -80px, color-mix(in srgb, var(--accent) 10%, transparent), transparent);
  background-repeat:no-repeat; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100%; letter-spacing:.1px;}
header{position:sticky; top:0; z-index:5; padding:13px 20px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
  box-shadow:0 1px 0 0 var(--line);}
header::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--headerGrad); opacity:.55;}
header h1{font-size:18.5px; margin:0; font-weight:750; letter-spacing:.1px; color:var(--ink);}
@supports (background-clip:text) or (-webkit-background-clip:text){
  header h1{background:var(--headerGrad); -webkit-background-clip:text; background-clip:text; color:transparent;}
}
header .tag{color:var(--mute); font-size:12px; font-family:var(--mono); letter-spacing:.02em;}
main{max-width:720px; margin:0 auto; padding:18px 16px 60px; position:relative;}
.dataBar{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub); margin-bottom:14px; flex-wrap:wrap; font-family:var(--mono);}
.dataBar .dot{width:6px; height:6px; border-radius:50%; background:var(--mute);}
.dataBar.ok .dot{background:var(--buy); box-shadow:0 0 6px 1px var(--buy);}
.dataBar.stale{color:var(--stop); font-weight:650;}
.dataBar.stale .dot{background:var(--stop); box-shadow:0 0 6px 1px var(--stop);}

.macroCard{border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:16px; background:var(--panel); box-shadow:var(--glow); position:relative; overflow:hidden;}
.macroCard::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px;}
.macroCard.riskGreen::before{background:var(--buy); box-shadow:0 0 10px var(--buy);}
.macroCard.riskYellow::before{background:var(--sell); box-shadow:0 0 10px var(--sell);}
.macroCard.riskRed::before{background:var(--stop); box-shadow:0 0 10px var(--stop);}
.macroCard.riskGray::before{background:var(--mute);}
.macroHead{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; cursor:pointer; user-select:none;}
.macroTitle{font-size:13.5px; font-weight:700; letter-spacing:.02em;}
.macroTitle .macroCaret{display:inline-block; margin-left:6px; color:var(--mute); font-size:11px; transition:transform .2s;}
.macroCard.collapsed .macroCaret{transform:rotate(-90deg);}
.macroLight{font-size:12px; font-weight:700; padding:4px 11px; border-radius:20px; font-family:var(--mono);}
.macroLight.riskGreen{color:var(--buy); background:var(--buyBg); box-shadow:0 0 0 1px color-mix(in srgb, var(--buy) 35%, transparent);}
.macroLight.riskYellow{color:var(--sell); background:var(--sellBg); box-shadow:0 0 0 1px color-mix(in srgb, var(--sell) 35%, transparent);}
.macroLight.riskRed{color:var(--stop); background:var(--stopBg); box-shadow:0 0 0 1px color-mix(in srgb, var(--stop) 35%, transparent);}
.macroLight.riskGray{color:var(--mute); background:var(--panel2);}
.macroBody{overflow:hidden; max-height:3000px; transition:max-height .25s ease, opacity .2s ease; opacity:1;}
.macroCard.collapsed .macroBody{max-height:0; opacity:0;}
.macroReasons{font-size:12.5px; color:var(--sub); margin-top:8px; line-height:1.6;}
.macroGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin-top:10px;}
.macroItem{background:var(--panel2); border-radius:9px; padding:8px 10px; border:1px solid transparent; min-width:0;}
.macroItem .miLabel{font-size:10.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.macroItem .miPrice{font-size:13.5px; font-weight:700; margin-top:3px; font-family:var(--mono); white-space:nowrap;}
.macroItem .miVal{font-size:11.5px; font-weight:700; margin-top:1px; font-family:var(--mono); white-space:nowrap;}
.macroItem .miVal.up{color:var(--buy);} .macroItem .miVal.down{color:var(--sell);}
.breadthRow{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:10px; padding:8px 10px; border-radius:9px; background:var(--panel2);}
.breadthLight{font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px; font-family:var(--mono); white-space:nowrap;}
.breadthLight.riskGreen{color:var(--buy); background:var(--buyBg);}
.breadthLight.riskYellow{color:var(--sell); background:var(--sellBg);}
.breadthLight.riskRed{color:var(--stop); background:var(--stopBg);}
.breadthLight.riskGray{color:var(--mute); background:var(--panel);}
.breadthDetail{font-size:11.5px; color:var(--sub); font-family:var(--mono);}
.soxItem{box-shadow:0 0 0 1px color-mix(in srgb, var(--accent2) 30%, transparent);}
.soxTag{display:inline-block; margin-left:5px; font-size:9px; font-weight:700; padding:0 5px; border-radius:5px; background:color-mix(in srgb, var(--accent2) 18%, var(--panel)); color:var(--accent2); vertical-align:1px;}
.miVal5d{font-size:10.5px; font-weight:650; margin-top:1px; font-family:var(--mono); white-space:nowrap; color:var(--sub);}
.miVal5d.up{color:var(--buy);} .miVal5d.down{color:var(--sell);}
.breadthWarn{font-size:11px; color:var(--deep); font-weight:650; margin-top:4px; line-height:1.5;}
.macroEvents{font-size:11.5px; color:var(--sub); margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.macroNews{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.macroNewsTitle{font-size:11.5px; color:var(--sub); margin-bottom:6px; font-weight:650;}
.macroDigestTag{font-size:10px; padding:1px 7px; border-radius:6px; margin-left:6px; background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--accent); font-weight:700; vertical-align:1px;}
.digestSummary{font-size:12.5px; line-height:1.55; color:var(--ink);}
.digestSources{margin-top:3px; font-size:11px; color:var(--sub); line-height:1.5;}
.digestSources .newsLink{color:var(--sub);}
.digestSources .newsLink:hover{color:var(--accent);}
.newsPager{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
.newsPagerBtn{font-size:11px; padding:4px 9px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-family:var(--mono); cursor:pointer;}
.newsPagerBtn:disabled{opacity:0.35; cursor:default;}
.newsPagerBtn:not(:disabled):hover{border-color:var(--accent);}
.newsPagerDate{font-size:11.5px; color:var(--sub); font-family:var(--mono);}
.newsList{display:flex; flex-direction:column; gap:9px;}
.newsItem{font-size:12.5px; line-height:1.45;}
.newsItemMain{display:flex; gap:7px; align-items:baseline;}
.newsTag{flex:none; font-size:10px; padding:1px 6px; border-radius:6px; background:var(--panel2); color:var(--sub); font-family:var(--mono);}
.newsLink{color:var(--ink); text-decoration:none;}
.newsLink:hover, .newsLink:active{color:var(--accent); text-decoration:underline;}
.newsTime{flex:none; font-size:10.5px; color:var(--mute); font-family:var(--mono);}
.newsRelated{margin-top:2px; margin-left:2px; font-size:11px; color:var(--accent2);}
.newsEmpty{font-size:12px; color:var(--mute);}
.macroFoot{font-size:10.5px; color:var(--mute); margin-top:8px;}
.macroStale{font-size:11px; color:var(--mute); margin-left:6px;}
.summary{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.pill{font-size:12px; padding:5px 11px; border-radius:20px; border:1px solid var(--line); color:var(--sub); background:var(--panel); font-family:var(--mono);}
.pill b{color:var(--ink); font-weight:650; font-family:var(--mono);}
button.pill{cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .1s, background .15s, border-color .15s;}
button.pill:active{transform:scale(0.96);}
button.pill:hover{border-color:var(--accent);}
button.pill.active{background:var(--panel2, var(--panel)); border-color:currentColor; box-shadow:0 0 0 1px currentColor inset;}
.empty{border:1px dashed var(--line); border-radius:12px; padding:36px 20px; text-align:center; color:var(--sub); font-size:14px; line-height:1.7;}

.sectorHead{
  display:flex; align-items:baseline; gap:8px; margin:22px 0 8px; padding:0 2px 0 10px;
  font-size:12.5px; font-weight:700; color:var(--sub); letter-spacing:.6px; text-transform:uppercase;
  border-left:2px solid var(--accent2);
}
.sectorHead:first-of-type{margin-top:6px;}
.sectorHead .sectorCount{font-size:11px; font-weight:600; color:var(--mute); font-family:var(--mono); text-transform:none; letter-spacing:0;}
.sectorNewsBtn{margin-left:auto; font-size:11px; font-weight:600; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); border:none; border-radius:20px; padding:3px 10px; cursor:pointer; text-transform:none; letter-spacing:0; font-family:inherit;}
.sectorNewsBtn:hover{background:color-mix(in srgb, var(--accent) 24%, var(--panel2));}
.sectorNewsBox{margin:0 0 10px 10px; padding:10px 12px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); display:flex; flex-direction:column; gap:9px;}
.sectorNewsItem+.sectorNewsItem{padding-top:9px; border-top:1px solid var(--line);}
.sectorTag{display:inline-block; margin-left:8px; padding:2px 9px; border-radius:20px; background:var(--panel2); color:var(--sub); font-size:11.5px; font-weight:600; vertical-align:middle;}

.row{
  display:flex; align-items:center; gap:12px; padding:13px 14px 13px 12px; margin-bottom:7px;
  background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:10px; cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.row:hover{border-color:var(--accent); transform:translateX(1px);}
.row.rowBuy{border-left-color:var(--buy);} .row.rowSell{border-left-color:var(--sell);} .row.rowStop{border-left-color:var(--deep);}
.row .dotStatus{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.row .rInfo{flex:1; min-width:0;}
.row .rName{font-size:14.5px; font-weight:650;}
.row .rCode{color:var(--sub); font-size:12px; margin-left:6px; font-family:var(--mono);}
.row .rLabel{font-size:11.5px; color:var(--sub); margin-top:2px;}
.row .rPriceWrap{text-align:right; flex-shrink:0;}
.row .rPrice{font-size:15.5px; font-weight:700; font-variant-numeric:tabular-nums; font-family:var(--mono);}
.row .rChg{font-size:11px; font-weight:700; font-family:var(--mono); margin-top:2px; white-space:nowrap;}
.row .rChg.up{color:var(--buy);} .row .rChg.down{color:var(--sell);} .row .rChg.flat{color:var(--mute);}
.row .rPrevClose{font-size:10px; color:var(--mute); margin-top:1px; font-family:var(--mono); white-space:nowrap;}
.row .rChev{color:var(--mute); font-size:18px;}
.row .rStalePrice{color:var(--sell);}
.dotStatus.st-buy{background:var(--buy); box-shadow:0 0 7px 0 var(--buy);} .dotStatus.st-sell{background:var(--sell); box-shadow:0 0 7px 0 var(--sell);}
.dotStatus.st-stop{background:var(--deep); box-shadow:0 0 7px 0 var(--deep);} .dotStatus.st-hold{background:var(--hold);}
.dotStatus.st-none{background:var(--mute);}
.dotStatus.st-near-buy{background:var(--buy); box-shadow:0 0 0 3px var(--buyBg);}
.dotStatus.st-near-sell{background:var(--sell); box-shadow:0 0 0 3px var(--sellBg);}
.dotStatus.st-rebuy{background:var(--accent2); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent2) 20%, transparent), 0 0 8px 0 var(--accent2);}
.st-near-buy{color:var(--buy); background:var(--buyBg);}
.st-near-sell{color:var(--sell); background:var(--sellBg);}
.st-rebuy{color:var(--accent2); background:color-mix(in srgb, var(--accent2) 14%, var(--panel2));}
.searchBar{margin-bottom:14px; display:flex; gap:8px;}
.searchBar input{flex:1; min-width:0; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:14px;}
.signalToggleBtn{flex-shrink:0; padding:10px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--sub); font-size:12.5px; font-weight:650; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;}
.signalToggleBtn .sigDot{width:6px; height:6px; border-radius:50%; background:var(--mute);}
.signalToggleBtn.active{background:color-mix(in srgb, var(--sell) 14%, var(--panel)); border-color:var(--sell); color:var(--sell);}
.signalToggleBtn.active .sigDot{background:var(--sell); box-shadow:0 0 6px var(--sell);}

.backBtn{background:none; border:none; color:var(--sub); font-size:13.5px; cursor:pointer; padding:6px 0 14px; display:flex; align-items:center; gap:4px;}
.backBtn:hover{color:var(--accent);}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; box-shadow:var(--glow);}
.cardTop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
.ticker{font-size:19px; font-weight:750; letter-spacing:.1px;}
.ticker .code{color:var(--sub); font-weight:500; font-size:13px; margin-left:6px; font-family:var(--mono);}
.status{font-size:12px; font-weight:700; padding:5px 11px; border-radius:20px; white-space:nowrap; letter-spacing:.02em;}
.st-buy{color:var(--buy); background:var(--buyBg); box-shadow:0 0 0 1px color-mix(in srgb, var(--buy) 30%, transparent);}
.st-sell{color:var(--sell); background:var(--sellBg); box-shadow:0 0 0 1px color-mix(in srgb, var(--sell) 30%, transparent);}
.st-stop{color:var(--deep); background:var(--deepBg); box-shadow:0 0 0 1px color-mix(in srgb, var(--deep) 30%, transparent);}
.st-hold{color:var(--hold); background:var(--holdBg);}
.st-none{color:var(--mute); background:var(--panel2);}
.st-extended{color:var(--sell); background:var(--sellBg); box-shadow:0 0 0 1px color-mix(in srgb, var(--sell) 30%, transparent);}
.dotStatus.st-extended{background:var(--sell); box-shadow:0 0 7px 0 var(--sell);}

.tabBar{display:flex; gap:4px; margin:16px 0 0; padding-bottom:0; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;}
.tabBar::-webkit-scrollbar{display:none;}
.tabBtn{flex-shrink:0; background:none; border:none; padding:9px 13px; font-size:13px; font-weight:650; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; display:flex; align-items:center; gap:5px;}
.tabBtn:hover{color:var(--ink);}
.tabBtn.active{color:var(--accent); border-bottom-color:var(--accent);}
.tabBtn .tabBadge{font-size:10px; font-weight:700; background:var(--panel2); color:var(--mute); border-radius:10px; padding:1px 6px; font-family:var(--mono);}
.tabBtn.active .tabBadge{background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--accent);}
.tabPane{padding-top:16px;}

.rangeWrap{margin:22px 0 6px;}
.rangeTrack{position:relative; height:5px; border-radius:4px; background:var(--panel2); margin:26px 4px 26px; border:1px solid var(--line);}
.rangeFill{position:absolute; top:0; bottom:0; border-radius:4px; background:linear-gradient(90deg, var(--buy), var(--sell));}
.rangeMark{position:absolute; top:50%; transform:translate(-50%,-50%); width:2px; height:16px; background:var(--sub);}
.rangeMark .rmLabel{position:absolute; top:-24px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--sub); white-space:nowrap; font-weight:600;}
.rangeMark .rmVal{position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); font-size:10.5px; color:var(--mute); white-space:nowrap; font-family:var(--mono);}
.rangeMark.sup,.rangeMark.res{background:var(--mute); opacity:.6;}
.rangeEnds{display:flex; justify-content:space-between; font-size:10px; color:var(--mute); font-weight:600; margin-bottom:4px;}
.rangeMark.buy{background:var(--buy);} .rangeMark.buy .rmLabel{color:var(--buy);}
.rangeMark.sell{background:var(--sell);} .rangeMark.sell .rmLabel{color:var(--sell);}
.rangeMark.stop{background:var(--deep);} .rangeMark.stop .rmLabel{color:var(--deep);}
.rangeDot{position:absolute; top:50%; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid var(--panel); transform:translate(-50%,-50%); box-shadow:0 0 0 1px var(--accent), 0 0 10px 1px color-mix(in srgb, var(--accent) 60%, transparent);}

.distGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin:16px 0;}
.distItem{background:var(--panel2); border-radius:9px; padding:10px 12px; border:1px solid var(--line);}
.distItem .dLabel{font-size:11px; color:var(--sub);}
.distItem .dVal{font-size:15px; font-weight:700; margin-top:2px; font-family:var(--mono);}
.plList{display:flex; flex-direction:column; gap:8px; margin:16px 0;}
.plRow{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 14px;}
.plRow.current{border:2px solid var(--accent); padding:9px 13px;}
.plLabelWrap{display:flex; align-items:center; gap:8px; min-width:0;}
.plDot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--sub);}
.plLabel{font-size:12.5px; font-weight:600; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.plPrice{font-family:var(--mono); font-weight:700; font-size:15px; margin-left:auto;}
.plDist{font-family:var(--mono); font-size:12.5px; font-weight:700; color:var(--sub); min-width:58px; text-align:right;}
.plRow.buy .plDot{background:var(--buy);} .plRow.buy .plLabel{color:var(--buy);}
.plRow.sell .plDot{background:var(--sell);} .plRow.sell .plLabel{color:var(--sell);}
.plRow.stop .plDot{background:var(--deep);} .plRow.stop .plLabel{color:var(--deep);}
.plRow.stretch .plDot{background:var(--sell); opacity:.55;} .plRow.stretch .plLabel{color:var(--sell); opacity:.85;}

.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin:14px 0;}
.field label{display:block; font-size:11px; color:var(--sub); margin-bottom:4px;}
.field input{width:100%; padding:8px 9px; border-radius:7px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:14px; font-family:var(--mono);}

// 股票清單一律以 SEED_STOCKS 為準重新建立（網站是唯讀觀察站，沒有使用者自訂股票），
// localStorage 只當作「上次看到的價格／價位／研究資料」快取，讓頁面在資料載入完成前先有內容。
// 之前的作法是把整份清單存在 localStorage、只把 SEED 新增的股票補進去，會造成：
// 1) 從清單移除的股票永遠留著；2) 股票改名不會生效；3) 瀏覽器封鎖 localStorage 時整頁永遠空白。
// （原本的 RECAL/BOXRECAL 價位遷移程式也一併移除：價位一律以 data/research.json 為準覆蓋。）
function buildStocks(){
  const cached={};
  try{
    const raw=localStorage.getItem(KEY);
    const arr=raw?JSON.parse(raw):[];
    if(Array.isArray(arr)) arr.forEach(c=>{ if(c && c.code) cached[String(c.code).trim()]=c; });
  }catch(e){}
  return SEED_STOCKS.map(d=>{
    const c=cached[d.code]||{};
    const hasCachedPrice = c.price!==undefined && c.price!==null && c.price!=='';
    return {
      buy:'', sell:'', stop:'', support:'', resist:'', note:'',
      ...c,
      code:d.code, name:d.name,
      sector:c.sector||d.sector||'',
      price: hasCachedPrice ? c.price : d.price,
      // 快取來的價格在本次盤後資料載入前都視為「舊資料」，不顯示漲跌（避免把前一天的漲跌當成今天的）
      priceSource: hasCachedPrice ? 'cache' : 'seed',
      updated: hasCachedPrice ? (c.updated||'') : '內建初始價格（尚未取得盤後資料）',
    };
  });
}
stocks=buildStocks();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(stocks)); }catch(e){} }
function fmt(n){ return (n===''||n===null||n===undefined||isNaN(n))?'':Number(n); }
function pct(a,b){ if(isNaN(a)||isNaN(b)||b===0) return null; return ((a-b)/b*100); }
function pctStr(v){ if(v===null) return '—'; const s=v>=0?'+':''; return s+v.toFixed(1)+'%'; }

// 今日漲跌／昨收：change 是自動盤後資料帶的今日漲跌金額（帶正負號），沒有的話（手動輸入股價）
// 就不顯示，避免顯示錯誤的漲跌資訊
// 這檔的股價不是最新交易日的資料時（當天沒成交、這次沒抓到、還沒載入完成）明確標示出來，
// 避免把舊價格當成今天的收盤價在判斷訊號
function priceAgeHtml(s){
  if(!autoData) return '';
  if(s.priceSource==='auto'){
    if(!latestPriceDate || !s.priceDate || s.priceDate>=latestPriceDate) return '';
    return `<div class="rPrevClose rStalePrice">股價日期 ${s.priceDate}</div>`;
  }
  return `<div class="rPrevClose rStalePrice">${s.priceSource==='cache'?'上次瀏覽價格，非最新':'初始價格，非最新'}</div>`;
}

// 詳情頁會收起上方資料狀態列，所以股價不是最新交易日時要在詳情頁直接提示
function detailPriceNoteHtml(s){
  if(!autoData) return '';
  let msg='';
  if(s.priceSource==='auto'){
    if(latestPriceDate && s.priceDate && s.priceDate<latestPriceDate) msg=`⚠ 這檔股價是 ${s.priceDate} 的收盤價（最新交易日為 ${latestPriceDate}，可能當天未成交），訊號判斷請留意`;
  }else{
    msg='⚠ 這檔這次沒有取得最新盤後股價，顯示的是較舊的價格，訊號判斷可能不準';
  }
  return msg?`<div class="srcList" style="color:var(--sell); margin:8px 0 0">${msg}</div>`:'';
}

function changeBadgeHtml(s){
  const price=parseFloat(s.price), chg=parseFloat(s.change);
  if(isNaN(price) || isNaN(chg) || s.priceSource!=='auto') return '';
  const prevClose=Math.round((price-chg)*100)/100;
  if(isNaN(prevClose) || prevClose===0) return '';
  const chgPct=(chg/prevClose*100);
  const dir = chg>0?'up':(chg<0?'down':'flat');
  const arrow = chg>0?'▲':(chg<0?'▼':'—');
  const chgAbsStr = Math.abs(chg).toFixed(Math.abs(chg)%1===0?0:2);
  return `
    <div class="rChg ${dir}">${arrow}${chgAbsStr} (${chgPct>=0?'+':''}${chgPct.toFixed(2)}%)</div>
    <div class="rPrevClose">昨收 ${fmt(prevClose)}</div>`;
}

const NEAR_PCT=3; // 距離買賣參考價多少 % 以內算「接近提醒」
const REBUY_BAND_PCT=3; // 噴出後拉回測10日線，上下多少 % 以內算「拉回買回」提醒

// 讀取該股票目前的均線趨勢（只有上市股/累積滿20天的上櫃股才有 MA10/MA20）
function trendInfo(code){
  if(!technicalData || !technicalData.stocks) return null;
  const t=technicalData.stocks[code];
  if(!t || t.insufficientHistory || t.ma10===undefined || t.ma20===undefined) return null;
  return {t, uptrend: t.ma10>=t.ma20};
}

// 回測82筆個股期貨已平倉交易發現，獲利是「雙峰分布」：34%是0~2%的快速價差單，
// 但也有17%達10%以上、6%達15%以上的大波段單。用中位數(+4%)當成統一停利目標，
// 等於把「碰到噴出股」的能力，套用「碰到盤整股」的習慣去砍，這就是3037/2303/6213
// 被錯殺的根本原因。所以「停利目標」只當第一次減碼參考，均線沒走弱前不設全出上限，
// 改用這個「延伸目標」(第一階段減碼價 * 1.15，對應大波段單的中位數幅度) 當續抱的具體指引。
// 原本用「買進參考價」當基準，但箱型校正後買進價跟減碼價已經拉開了合理距離，改用減碼價
// 起算才符合「站上箱頂/前高後還能噴多遠」的原意。
const STRETCH_MULT=1.15;
function niceRoundPrice(x){
  if(x>=200) return Math.round(x/5)*5;
  if(x>=20) return Math.round(x);
  return Math.round(x*2)/2;
}
function stretchTargetOf(sellRef){
  if(sellRef===null || isNaN(sellRef)) return null;
  return niceRoundPrice(sellRef*STRETCH_MULT);
}

// 回測分析發現：容易「賣飛」的股票（如3037欣興、2303聯電、6213聯茂）共同點是
// 停利出場後均線仍多頭排列、股價持續噴出，卻沒有再進場；而執行得好的（景碩、環球晶、金居）
// 都是出場後很快抓拉回買回，等於用均線接力續抱。以下兩個機制就是把這個差異變成系統化提醒：
// 1) 到達停利目標但均線仍多頭排列時，標示為「分批減碼，勿全出」而非單純「賣出」
// 2) 噴出後拉回測10日均線、且均線仍未走弱時，標示「拉回買回」提醒，取代靜態買價
// 「噴出未拉回」的判斷門檻（2026-09-27 定義）：近20個交易日漲幅≥20%，且現價距20日高點≤7%
const EXTENDED_CHANGE20_PCT=20;
const EXTENDED_NEAR_HIGH_PCT=7;
function isExtendedNow(trend, p){
  if(!trend || isNaN(p)) return false;
  const t=trend.t;
  if(t.change20d===undefined || t.high20===undefined || !t.high20) return false;
  const distHigh=(t.high20-p)/t.high20*100;
  return t.change20d>=EXTENDED_CHANGE20_PCT && distHigh<=EXTENDED_NEAR_HIGH_PCT;
}

function statusOf(s){
  const p=parseFloat(s.price);
  if(isNaN(p)) return {cls:'st-none', label:'尚未取得股價'};
  const buy=parseFloat(s.buy), stop=parseFloat(s.stop), sell=parseFloat(s.sell);
  const aiBuy=parseFloat(s.support), aiSell=parseFloat(s.resist);
  const buyRef = !isNaN(buy)?buy:(!isNaN(aiBuy)?aiBuy:null);
  const buyIsAi = isNaN(buy) && !isNaN(aiBuy);
  const sellRef = !isNaN(sell)?sell:(!isNaN(aiSell)?aiSell:null);
  const sellIsAi = isNaN(sell) && !isNaN(aiSell);
  const trend=trendInfo(String(s.code||'').trim());

  if(!isNaN(stop) && p<=stop) return {cls:'st-stop', label:'超跌區 · 基本面未變可分批加碼'};
  if(buyRef!==null && p<=buyRef) return {cls:'st-buy', label:buyIsAi?'建倉買進（AI 建議）':'建倉買進'};

  // 噴出未拉回：近20日大漲且現價仍貼近20日高點，代表這波噴出還沒被真正拉回測試過，
  // 現在的「安全買進」只是噴出後的短暫整理，不是經過驗證的支撐，追價風險較高。
  // 改為每天用技術指標即時判斷（原本是分析當下寫死在 research.json 的旗標，股價回落後不會解除，
  // 例如 2026-09-29 聯發科回落到安全買進上方1%，仍被標成「勿追價」，蓋掉了「接近提醒‧安全買進」）。
  const isExtended = isExtendedNow(trend, p);
  if(isExtended && buyRef!==null && p>buyRef && (sellRef===null || p<sellRef)){
    return {cls:'st-extended', label:'突破區間/創短期新高尚未拉回 · 追價風險高，勿在此追價'};
  }

  // 噴出後拉回測10日均線：股價明顯高於原始買點（代表已經噴出過一段），
  // 現在拉回到10日線附近，且均線仍多頭排列 → 視為「買回」訊號，而不是原本的靜態買點
  // 「突破後」要真的突破過：近20日最高價曾站上部分停利（箱頂），否則只是箱型內震盪、
  // 剛好貼近10日線，不該標成「突破後拉回找買點」（例如穩懋從未站上箱頂卻被標成買回訊號）。
  const brokeOut = !!(trend && sellRef!==null && trend.t.high20!==undefined && trend.t.high20>=sellRef);
  if(trend && trend.uptrend && buyRef!==null && brokeOut){
    const ma10=trend.t.ma10;
    const distToMa10=(p-ma10)/ma10*100;
    const extendedAboveBuy=(p-buyRef)/buyRef*100;
    if(extendedAboveBuy>REBUY_BAND_PCT*2 && distToMa10>=-REBUY_BAND_PCT && distToMa10<=REBUY_BAND_PCT){
      return {cls:'st-rebuy', label:`突破後拉回找買點 · 拉回測10日均線（10MA ${ma10}）`};
    }
  }

  if(sellRef!==null && p>=sellRef){
    if(trend && trend.uptrend){
      const stretch=stretchTargetOf(sellRef);
      if(stretch!==null && p<stretch){
        return {cls:'st-sell', momentum:'first-stage', stretch, label:`漲多停利減碼 · 分批減碼，續抱看 ${stretch}（均線多頭）`};
      }
      return {cls:'st-sell', momentum:'extended', stretch, label:`漲多停利減碼 · 已達延伸目標 ${stretch!==null?stretch:''}，可分批加重出場`};
    }
    return {cls:'st-sell', label:sellIsAi?'漲多停利減碼（AI 建議）· 分批賣出':'漲多停利減碼 · 分批賣出'};
  }
  if(buyRef!==null){
    const d=(p-buyRef)/buyRef*100;
    if(d>0 && d<=NEAR_PCT) return {cls:'st-near-buy', label:`接近提醒 · ${buyIsAi?'AI 建議':''}安全買進（+${d.toFixed(1)}%）`};
  }
  if(sellRef!==null){
    const d=(sellRef-p)/sellRef*100;
    if(d>0 && d<=NEAR_PCT) return {cls:'st-near-sell', label:`接近提醒 · ${sellIsAi?'AI 建議':''}部分停利（-${d.toFixed(1)}%）`};
  }
  return {cls:'st-hold', label:'續抱觀察 · 區間內'};
}

const PAGE_LOAD_TS=Date.now();
async function fetchJson(path){
  // 加上時間戳參數，避免 GitHub Pages 的 CDN（Fastly）快取到舊版資料——
  // cache:'no-store' 只能防止瀏覽器自己的快取，防不了 CDN 邊緣快取。
  const bust = path.includes('?') ? `&_=${PAGE_LOAD_TS}` : `?_=${PAGE_LOAD_TS}`;
  try{ const res=await fetch(path+bust,{cache:'no-store'}); if(!res.ok) return null; return await res.json(); }
  catch(e){ return null; }
}

let latestPriceDate=''; // 追蹤股票中最新的收盤價交易日，用來標示「股價不是最新交易日」的個別股票
async function loadAutoData(){
  const bar=document.getElementById('dataBar');
  const text=document.getElementById('dataBarText');
  const [twse,tpex]=await Promise.all([fetchJson('data/prices.json'),fetchJson('data/prices_otc.json')]);
  const merged=[]; const parts=[]; const warnings=[];
  const addMarket=(json,market)=>{
    if(!json || !Array.isArray(json.stocks)){
      warnings.push(`${market}資料讀取失敗，${market}股票顯示的是上次瀏覽時的價格`);
      return;
    }
    const fileDate=json.trackedDate||json.date||'';
    merged.push(...json.stocks.map(s=>({...s,market,date:s.date||fileDate})));
    parts.push(`${market} ${fileDate}${json.stale?'（抓取失敗，非最新）':''}`);
    if(json.stale) warnings.push(`${market}收盤價抓取失敗，顯示的是前一次成功的資料`);
  };
  addMarket(twse,'上市');
  addMarket(tpex,'上櫃');
  if(merged.length){
    autoData={stocks:merged};
    applyAutoPrices();
  }
  // stale／讀取失敗：顯示的股價可能不是最新交易日，用醒目的警示樣式提醒，
  // 避免使用者以為看到的是今天的收盤價、進而依據過期股價判斷買賣訊號。
  if(warnings.length){
    bar.className='dataBar stale';
    text.textContent='⚠ '+(parts.length?('自動盤後資料：'+parts.join('，')+'　'):'')+warnings.join('；');
  }else if(parts.length){
    bar.className='dataBar ok';
    text.textContent='自動盤後資料：'+parts.join('，');
  }else{
    bar.className='dataBar';
    text.textContent='尚無自動盤後資料，等待排程首次執行';
  }
}

function applyAutoPrices(){
  if(!autoData) return;
  const byCode={};
  autoData.stocks.forEach(x=>{ byCode[String(x.code).trim()]=x; });
  let changed=false;
  stocks.forEach(s=>{
    if(!s.code) return;
    const match=byCode[String(s.code).trim()];
    const close=match ? parseFloat(String(match.close).replace(/,/g,'')) : NaN;
    if(match && !isNaN(close)){
      s.price=close; s.priceSource='auto'; s.priceDate=match.date||'';
      s.updated=`${match.market||''} ${match.date||''} 收盤`.trim();
      const chg=parseFloat(String(match.change).replace(/,/g,''));
      s.change=isNaN(chg)?'':chg;
      changed=true;
    }else if(s.priceSource==='auto'){
      // 這次沒有拿到這檔的收盤價（例如當天暫停交易）：保留舊價格但不再當成今天的資料
      s.priceSource='cache'; changed=true;
    }
  });
  latestPriceDate=stocks.reduce((m,s)=>(s.priceSource==='auto' && s.priceDate && s.priceDate>m)?s.priceDate:m,'');
  if(changed){ save(); render(); }
}

// ---- 研究資料合併（自動讀取 data/research.json 與手動匯入共用同一套邏輯）----
// item 格式：{ code, name?, support?, resist?, buy?, sell?, stop?, research:{ updated, technical:{view,source}, revenue:{monthly,quarterly,sources}, reports:[...], news:{summary,sources} } }
function mergeResearchList(list, opts){
  opts = opts || {};
  let matched=0, added=0, changed=false;
  list.forEach(item=>{
    if(!item || !item.code) return;
    const code=String(item.code).trim();
    let idx=stocks.findIndex(s=>String(s.code).trim()===code);
    if(idx===-1){
      if(!opts.allowAdd) return; // 自動路徑：只更新已追蹤的股票，不會自動幫你新增新標的
      stocks.push({code, name:item.name||'', price:'', sector:item.sector||'', buy:'', sell:'', stop:'', support:'', resist:'', note:'', updated:'', priceSource:''});
      idx=stocks.length-1;
      added++;
    }else{
      matched++;
    }
    const s=stocks[idx];
    if(item.research){
      s.research=item.research;
      changed=true;
    }
    // 產業分類由研究資料為準，永遠以最新分類覆蓋（不是使用者手動填的欄位）
    if(item.sector!==undefined && item.sector!==null && item.sector!=='' && s.sector!==item.sector){
      s.sector=item.sector; changed=true;
    }
    // 網站已改為唯讀觀察站（不再有手動輸入價位的介面），這些欄位一律都是自動產生的，
    // 所以永遠以 research.json 最新版本覆蓋，不再有「使用者手動改過就不覆蓋」的顧慮。
    ['support','resist','buy','sell','stop'].forEach(f=>{
      if(!(f in item)) return;
      // research.json 明確給 null/空字串代表「清除這個價位」，之前會被忽略而沿用舊值
      const v=(item[f]===null || item[f]===undefined) ? '' : item[f];
      if(s[f]!==v){ s[f]=v; changed=true; }
    });
  });
  if(changed){ save(); render(); }
  return {matched, added};
}

async function loadResearchData(){
  const json=await fetchJson('data/research.json');
  if(!json || !Array.isArray(json.stocks)) return;
  mergeResearchList(json.stocks, {allowAdd:false});
}

let technicalData=null;
// 市場內部強弱燈號：計算追蹤股票中「收盤價跌破自己20日均線」的比例。
// 這個比例就是回測驗證過、能有效壓低系統性下跌期間最大回撤的「大盤濾網」同一套邏輯
// （見7月AI資本支出疑慮事件回測：加上此濾網後最大回撤從28.0%降到8.17%），
// 現在做成即時指標讓使用者不用等回測就能看到目前的市場內部結構。
const BREADTH_RED_PCT=50; // 跌破20日均線比例 >= 50% 視為系統性轉弱
const BREADTH_YELLOW_PCT=30; // >= 30% 視為部分轉弱、留意擴散
let marketBreadthData=null;
function computeMarketBreadth(){
  if(!technicalData || !technicalData.stocks) return null;
  let weak=0, total=0;
  Object.values(technicalData.stocks).forEach(t=>{
    if(t && t.lastClose!=null && t.ma20!=null && !isNaN(t.lastClose) && !isNaN(t.ma20)){
      total++;
      if(t.lastClose < t.ma20) weak++;
    }
  });
  if(total===0) return null;
  const pct = weak/total*100;
  let level='green', label='多數追蹤股票站上20日均線，內部結構健康';
  if(pct>=BREADTH_RED_PCT){ level='red'; label='多數追蹤股票同步跌破20日均線，屬系統性轉弱期間'; }
  else if(pct>=BREADTH_YELLOW_PCT){ level='yellow'; label='部分追蹤股票轉弱，留意是否持續擴散'; }
  return {pct:Math.round(pct*10)/10, weak, total, level, label};
}
async function loadTechnical(){
  const json=await fetchJson('data/technical.json');
  if(!json) return;
  technicalData=json;
  marketBreadthData=computeMarketBreadth();
  render(); // 列表頁的「拉回買回」提示與強勢燈號也要跟著技術資料更新，不只是詳情頁
  renderMacroCard(); // 強弱燈號放在盤前簡報卡片內，技術資料到位後要一併重繪
}

async function loadNewsForCurrentDate(){
  const date=newsIndex[newsDateIdx];
  if(!date) return;
  const [json, digest]=await Promise.all([
    fetchJson(`data/news/${date}.json`),
    fetchJson(`data/news/${date}-digest.json`),
  ]);
  // 快速連點「較舊/較新」時，較早發出的請求可能比較晚回來：只採用目前選中日期的結果
  if(newsIndex[newsDateIdx]!==date) return;
  // 這天的檔案讀取失敗時，不能沿用上一天的內容（之前會出現「日期是A、內容是B」的錯亂）
  newsData = json || {date, items:[], missing:true};

function newsGoTo(delta){
  const next=newsDateIdx+delta;
  if(next<0 || next>=newsIndex.length) return;
  newsDateIdx=next;
  loadNewsForCurrentDate();
}

function relativeTimeFrom(iso){
  if(!iso) return '';
  const t=new Date(iso).getTime();
  if(isNaN(t)) return '';
  const diffMin=Math.round((Date.now()-t)/60000);
  if(diffMin<1) return '剛剛';
  if(diffMin<60) return `${diffMin}分鐘前`;
  const diffHr=Math.round(diffMin/60);
  if(diffHr<24) return `${diffHr}小時前`;
  const diffDay=Math.round(diffHr/24);
  return `${diffDay}天前`;
}

// 台北時區的今天（YYYY-MM-DD）與日期差，用來即時計算事件倒數、判斷新聞是不是「今天」
function taipeiToday(){
  try{ return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'}); }
  catch(e){ const d=new Date(Date.now()+8*3600*1000); return d.toISOString().slice(0,10); }
}
function daysBetween(fromIso,toIso){
  const a=Date.UTC(+fromIso.slice(0,4),+fromIso.slice(5,7)-1,+fromIso.slice(8,10));
  const b=Date.UTC(+toIso.slice(0,4),+toIso.slice(5,7)-1,+toIso.slice(8,10));
  return Math.round((b-a)/86400000);
}

function fmtPct(v){ if(v===undefined||v===null||isNaN(v)) return null; const s=v>=0?'+':''; return s+v.toFixed(2)+'%'; }

// 「跌深買進(超跌區)」訊號在市場內部強弱燈號轉紅（多數追蹤股票同步跌破20日均線）時，
// 額外附加系統性風險警示——超跌可能是個股機會，也可能是系統性下殺的一部分，
// 這時候更需要先確認基本面假設是否還成立，而不是機械式加碼。
function stopBreadthWarningHtml(cls){
  if(cls!=='st-stop' || !marketBreadthData || marketBreadthData.level!=='red') return '';
  return `<div class="breadthWarn">⚠ 目前${marketBreadthData.weak}/${marketBreadthData.total}檔追蹤股票同步跌破20日均線，屬系統性下跌期間，加碼前請留意基本面假設是否仍成立</div>`;
}

let macroCollapsed=false;
function renderMacroCard(){
  const el=document.getElementById('macroCard');
  if(!el || !macroData) return;
  const rl=macroData.riskLight||{level:'gray',label:'資料暫缺',reasons:[]};
  const cls='risk'+rl.level.charAt(0).toUpperCase()+rl.level.slice(1);
  const idx=macroData.indices||{};
  const names={dji:'道瓊',sp500:'S&P500',nasdaq:'那斯達克',sox:'費半',vix:'VIX',dxy:'美元指數',tsmAdr:'台積電ADR'};
  let gridHtml='';
  Object.keys(names).forEach(k=>{
    const d=idx[k];
    if(!d) return;
    const dir = d.changePct>0?'up':(d.changePct<0?'down':'');
    const isSox = k==='sox';
    const c5 = d.change5dPct;
    const c5Html = (isSox && c5!==undefined && c5!==null)
      ? `<div class="miVal5d ${c5>0?'up':(c5<0?'down':'')}">5日${fmtPct(c5)||''}</div>` : '';
    gridHtml+=`<div class="macroItem${isSox?' soxItem':''}"><div class="miLabel">${names[k]}${isSox?'<span class="soxTag">領先指標</span>':''}</div><div class="miPrice">${d.price}</div><div class="miVal ${dir}">${fmtPct(d.changePct)||''}</div>${c5Html}</div>`;
  });
  // 倒數天數在瀏覽器即時計算：macro.json 只在每個交易日早上8點產生一次，
  // 直接用檔案裡的 daysAway 會在週末/隔天看到錯的倒數，已經過去的事件也還掛著「今天」
  const todayTpe=taipeiToday();
  const events=(macroData.upcomingEvents||[])
    .map(e=>({...e, daysAway: daysBetween(todayTpe, e.date)}))
    .filter(e=>e.daysAway>=0);
  const eventsHtml = events.length
    ? `<div class="macroEvents">近期財經事件：${events.map(e=>`${e.watch?'🔥':''}${e.date} ${e.name}${e.daysAway===0?'（今天）':`（${e.daysAway}天後）`}`).join('、')}</div>`
    : '';
  const breadth = marketBreadthData;
  const bCls = breadth ? 'risk'+breadth.level.charAt(0).toUpperCase()+breadth.level.slice(1) : '';
  const breadthHtml = breadth
    ? `<div class="breadthRow ${bCls}">
        <span class="breadthLight ${bCls}">${breadth.label}</span>
        <span class="breadthDetail">${breadth.weak}/${breadth.total} 檔（${breadth.pct}%）跌破自己的20日均線</span>
      </div>`
    : '';
  const newsItems=(newsData && newsData.items) || [];
  const hasNewsArchive = newsIndex.length>0;
  const newsDateLabel = newsIndex[newsDateIdx] || (newsData && newsData.date) || '';
  const canGoOlder = newsDateIdx < newsIndex.length-1;
  const canGoNewer = newsDateIdx > 0;
  const newsPagerHtml = hasNewsArchive
    ? `<div class="newsPager">
        <button type="button" id="newsOlderBtn" class="newsPagerBtn" ${canGoOlder?'':'disabled'}>‹ 較舊</button>
        <span class="newsPagerDate">${newsDateLabel}${newsDateLabel===taipeiToday()?'（今天）':''}</span>
        <button type="button" id="newsNewerBtn" class="newsPagerBtn" ${canGoNewer?'':'disabled'}>較新 ›</button>
      </div>`
    : '';
  const digestItems=(digestData && digestData.items) || [];
  const hasDigest=digestItems.length>0;
  // 總經類：沒有相關持股的消息，顯示在最上方的總經簡報卡片。有相關持股的算「產業類」，
  // 改顯示在該產業分類旁邊（見 sectorNewsFor），這裡不重複列出，避免同一則新聞出現兩次。
  const macroOnlyItems = digestItems.filter(d=>!(d.relatedStocks && d.relatedStocks.length));
  const sectorItemsCount = digestItems.length - macroOnlyItems.length;
  const newsHtml = (hasNewsArchive)
    ? `<div class="macroNews">
        <div class="macroNewsTitle">總經焦點消息${hasDigest?'<span class="macroDigestTag">Claude 每日彙整</span>':''}${newsData && newsData.stale?'<span class="macroStale">（上次成功結果，非最新）</span>':''}</div>
        ${newsPagerHtml}
        <div class="newsList">
          ${hasDigest ? (macroOnlyItems.length ? macroOnlyItems.map(d=>`
            <div class="newsItem">
              <div class="digestSummary">${d.summary}</div>
              ${(d.sources&&d.sources.length) ? `<div class="digestSources">來源：${d.sources.map(s=>`<a class="newsLink" href="${s.url}" target="_blank" rel="noopener">${s.title}</a>`).join('、')}</div>` : ''}
            </div>`).join('') : `<div class="newsEmpty">今天沒有總經類消息${sectorItemsCount?'，產業類消息請到下面個股列表對應分類旁查看':''}</div>`)
          : (newsItems.length ? newsItems.map(n=>`
            <div class="newsItem">
              <div class="newsItemMain">
                <span class="newsTag">${n.source||''}</span>
                <a class="newsLink" href="${n.link}" target="_blank" rel="noopener">${n.title}</a>
                <span class="newsTime">${relativeTimeFrom(n.pubDate)}</span>
              </div>
              ${(n.relatedStocks&&n.relatedStocks.length) ? `<div class="newsRelated">相關持股：${(()=>{ const rs=n.relatedStocks; const shown=rs.slice(0,6).map(r=>`${r.name}(${r.code})`).join('、'); return rs.length>6 ? `${shown} 等共${rs.length}檔` : shown; })()}</div>` : ''}
            </div>`).join('') : `<div class="newsEmpty">這天沒有抓到相關新聞</div>`)}
        </div>
      </div>`
    : '';
  el.innerHTML=`
    <div class="macroCard ${cls}${macroCollapsed?' collapsed':''}">
      <div class="macroHead" id="macroHeadBtn">
        <span class="macroTitle">盤前國際總經簡報${macroData.stale?'<span class="macroStale">（資料為上次成功結果，非最新）</span>':''}<span class="macroCaret">▾</span></span>
        <span class="macroLight ${cls}">${rl.label}</span>
      </div>
      <div class="macroBody">
        <div class="macroReasons">${(rl.reasons||[]).join('；')}</div>
        ${breadthHtml}
        ${gridHtml?`<div class="macroGrid">${gridHtml}</div>`:''}
        ${eventsHtml}
        ${newsHtml}
        <div class="macroFoot">${macroData.generated?('更新於 '+macroData.generated+'　'):''}${macroData.note||''}${newsData && newsData.note?('　'+newsData.note):''}</div>
      </div>
    </div>`;
  document.getElementById('macroHeadBtn').addEventListener('click',()=>{
    macroCollapsed=!macroCollapsed;
    renderMacroCard();
  });
  const olderBtn=document.getElementById('newsOlderBtn');
  const newerBtn=document.getElementById('newsNewerBtn');
  if(olderBtn) olderBtn.addEventListener('click',(e)=>{ e.stopPropagation(); newsGoTo(1); });
  if(newerBtn) newerBtn.addEventListener('click',(e)=>{ e.stopPropagation(); newsGoTo(-1); });
}

function render(){
  const macroEl=document.getElementById('macroCard');
  const dataBarEl=document.getElementById('dataBar');
  const isDetail = activeIndex!==null && stocks[activeIndex];
  // 個股詳情頁只專注這一檔，盤前簡報與自動資料狀態列收起，減少滑動距離
  if(macroEl) macroEl.style.display = isDetail ? 'none' : '';
  if(dataBarEl) dataBarEl.style.display = isDetail ? 'none' : '';
  if(isDetail) renderDetail(activeIndex);
  // 列表已經在畫面上時只重繪列表內容，不重建搜尋框——資料是非同步陸續載入的，
  // 之前每載入一份資料就重建一次搜尋框，打字打到一半會失去焦點（手機鍵盤會直接收起來）
  else if(document.getElementById('rows') && document.getElementById('searchBox')) renderRows();
  else renderList();
}

let searchQuery='';
let signalOnly=false;
let pillFilter=null; // null | 'st-buy' | 'st-sell' | 'st-stop' | 'st-rebuy' | 'near' | 'st-hold'
const SIGNAL_CLASSES=['st-buy','st-sell','st-stop','st-rebuy','st-extended'];
let sectorNewsExpanded={}; // 產業分類旁「相關新聞」展開狀態，key=sector 名稱
function sectorNewsFor(codes){
  if(!digestData || !Array.isArray(digestData.items) || !codes || !codes.length) return [];
  const codeSet=new Set(codes);
  return digestData.items.filter(it=>(it.relatedStocks||[]).some(rs=>codeSet.has(rs.code)));
}
function sectorNewsItemHtml(it){
  return `<div class="sectorNewsItem">
    <div class="digestSummary">${it.summary}</div>
    ${(it.sources&&it.sources.length)?`<div class="digestSources">來源：${it.sources.map(s=>`<a class="newsLink" href="${s.url}" target="_blank" rel="noopener">${s.title}</a>`).join('、')}</div>`:''}
  </div>`;
}

function renderList(){
  const view=document.getElementById('view');
  if(stocks.length===0){
    view.innerHTML=`
      <div class="empty">還沒有追蹤的股票，等待資料載入中…</div>`;
    return;
  }
  view.innerHTML=`
    <div class="summary" id="summaryBox"></div>
    <div class="searchBar">
      <input id="searchBox" placeholder="搜尋股票代號或名稱" value="${(searchQuery||'').replace(/"/g,'&quot;')}">
      <button id="signalToggleBtn" class="signalToggleBtn${signalOnly?' active':''}" type="button"><span class="sigDot"></span>今日訊號${signalOnly?'（顯示中）':''}</button>
    </div>
    <div id="rows"></div>
  `;
  document.getElementById('searchBox').addEventListener('input',(e)=>{
    searchQuery=e.target.value;
    renderRows();
  });
  document.getElementById('signalToggleBtn').addEventListener('click',()=>{
    signalOnly=!signalOnly;
    renderList();
  });
  renderRows();
}

function renderRows(){
  const rowsEl=document.getElementById('rows');
  const summaryBox=document.getElementById('summaryBox');
  if(!rowsEl) return;

  const counts={'st-buy':0,'st-sell':0,'st-stop':0,'st-hold':0,'st-none':0,'st-near-buy':0,'st-near-sell':0,'st-rebuy':0,'st-extended':0};
  stocks.forEach(s=>{ const c=statusOf(s).cls; if(counts[c]!==undefined) counts[c]++; });

  if(summaryBox){
    const pillActive=(key)=> pillFilter===key ? ' active' : '';
    // 由買進排到賣出（價格由低到高）：超跌區 → 建倉買進 → 接近提醒‧買進 → 突破後拉回找買點
    // → 續抱觀察 → 接近提醒‧賣出 → 漲多停利減碼 → 突破區間/創短期新高尚未拉回
    summaryBox.innerHTML=`
      <button type="button" class="pill${pillActive(null)}" data-pill="all"><b>${stocks.length}</b> 檔追蹤中</button>
      <button type="button" class="pill${pillActive('st-stop')}" data-pill="st-stop" style="color:var(--deep)"><b>${counts['st-stop']}</b> 超跌區</button>
      <button type="button" class="pill${pillActive('st-buy')}" data-pill="st-buy" style="color:var(--buy)"><b>${counts['st-buy']}</b> 建倉買進</button>
      <button type="button" class="pill${pillActive('st-near-buy')}" data-pill="st-near-buy" style="color:var(--buy)"><b>${counts['st-near-buy']}</b> 接近提醒‧買進</button>
      <button type="button" class="pill${pillActive('st-rebuy')}" data-pill="st-rebuy" style="color:var(--accent2)"><b>${counts['st-rebuy']}</b> 突破後拉回找買點</button>
      <button type="button" class="pill${pillActive('st-hold')}" data-pill="st-hold"><b>${counts['st-hold']}</b> 續抱觀察</button>
      <button type="button" class="pill${pillActive('st-near-sell')}" data-pill="st-near-sell" style="color:var(--sell)"><b>${counts['st-near-sell']}</b> 接近提醒‧賣出</button>
      <button type="button" class="pill${pillActive('st-sell')}" data-pill="st-sell" style="color:var(--sell)"><b>${counts['st-sell']}</b> 漲多停利減碼</button>
      <button type="button" class="pill${pillActive('st-extended')}" data-pill="st-extended" style="color:var(--sell)"><b>${counts['st-extended']}</b> 突破區間/創短期新高尚未拉回</button>
    `;
    summaryBox.querySelectorAll('[data-pill]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const key=btn.dataset.pill==='all'?null:btn.dataset.pill;
        pillFilter = (pillFilter===key) ? null : key;
        renderRows();
      });
    });
  }

  const q=(searchQuery||'').trim().toLowerCase();
  const items=stocks.map((s,i)=>({s,i})).filter(({s})=>{
    if(signalOnly && !SIGNAL_CLASSES.includes(statusOf(s).cls)) return false;
    if(pillFilter){
      const cls=statusOf(s).cls;
      if(cls!==pillFilter) return false;
    }
    if(!q) return true;
    return (s.code||'').toLowerCase().includes(q) || (s.name||'').toLowerCase().includes(q);
  });

  if(items.length===0){
    const pillLabels={'st-buy':'建倉買進','st-sell':'漲多停利減碼','st-stop':'超跌區','st-rebuy':'突破後拉回找買點','st-extended':'突破區間/創短期新高尚未拉回','st-near-buy':'接近提醒‧買進','st-near-sell':'接近提醒‧賣出','near':'接近提醒','st-hold':'續抱觀察'};
    const pillName = pillFilter ? (pillLabels[pillFilter]||pillFilter) : '';
    const emptyMsg = (signalOnly && pillFilter) ? `「今日訊號」和「${pillName}」兩個篩選同時開著，沒有股票同時符合，可以關掉其中一個。`
      : (q && (signalOnly || pillFilter)) ? `在目前的篩選條件下，找不到符合「${searchQuery}」的股票。`
      : signalOnly ? '今天沒有股票達到買進／賣出／深度加碼訊號，可以先休息一下。'
      : pillFilter ? `目前沒有股票屬於「${pillName}」。`
      : `找不到符合「${searchQuery}」的股票`;
    rowsEl.innerHTML=`<div class="empty">${emptyMsg}</div>`;
    return;
  }

  // 依產業分組（搜尋時只顯示有符合結果的分組）
  const groups={};
  items.forEach(({s,i})=>{
    const sec=s.sector||'其他';
    if(!groups[sec]) groups[sec]=[];
    groups[sec].push({s,i});
  });
  const orderedSectors=SECTOR_ORDER.filter(sec=>groups[sec]&&groups[sec].length)
    .concat(Object.keys(groups).filter(sec=>!SECTOR_ORDER.includes(sec)));

  let rows='';
  orderedSectors.forEach(sec=>{
    const secCodes=groups[sec].map(({s})=>s.code).filter(Boolean);
    const secNews=sectorNewsFor(secCodes);
    const secExpanded=!!sectorNewsExpanded[sec];
    rows+=`<div class="sectorHead">${sec}<span class="sectorCount">${groups[sec].length}</span>${secNews.length?`<button type="button" class="sectorNewsBtn" data-sector="${sec}">📰 ${secNews.length}則產業消息${secExpanded?' ▴':' ▾'}</button>`:''}</div>`;
    if(secNews.length && secExpanded){
      rows+=`<div class="sectorNewsBox">${secNews.map(sectorNewsItemHtml).join('')}</div>`;
    }
    groups[sec].forEach(({s,i})=>{
      const st=statusOf(s);
      const accentCls = st.cls==='st-buy'||st.cls==='st-near-buy'||st.cls==='st-rebuy' ? 'rowBuy' : (st.cls==='st-sell'||st.cls==='st-near-sell'||st.cls==='st-extended' ? 'rowSell' : (st.cls==='st-stop' ? 'rowStop' : ''));
      rows+=`
        <div class="row ${accentCls}" data-open="${i}">
          <div class="dotStatus ${st.cls}"></div>
          <div class="rInfo">
            <span class="rName">${s.name||'(未命名)'}</span><span class="rCode">${s.code||''}</span>
            <div class="rLabel">${st.label}</div>
            ${stopBreadthWarningHtml(st.cls)}
          </div>
          <div class="rPriceWrap">
            <div class="rPrice">${s.price?fmt(s.price):'—'}</div>
            ${changeBadgeHtml(s)}
            ${priceAgeHtml(s)}
          </div>
          <div class="rChev">›</div>
        </div>`;
    });
  });
  rowsEl.innerHTML=rows;
  rowsEl.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click',()=>{ savedListScrollY=window.scrollY; activeIndex=parseInt(el.dataset.open,10); activeTab='overview'; render(); window.scrollTo(0,0); });
  });
  rowsEl.querySelectorAll('.sectorNewsBtn').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const sec=btn.dataset.sector;
      sectorNewsExpanded[sec]=!sectorNewsExpanded[sec];
      renderRows();
    });
  });
}


function renderSources(list){
  if(!list || !list.length) return '';
  return `<div class="srcList">資料來源：${list.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.title||s.url}</a>`).join('、')}</div>`;
}

function marginTrend(cur,prev){
  const c=parseFloat(cur), p=parseFloat(prev);
  if(isNaN(c)||isNaN(p)) return '';
  const d=c-p;
  if(Math.abs(d)<0.05) return '<span class="mTrend mFlat">→ 持平</span>';
  return d>0?`<span class="mTrend mUp">▲ 較上季 +${d.toFixed(1)}ppt</span>`:`<span class="mTrend mDown">▼ 較上季 ${d.toFixed(1)}ppt</span>`;
}
function renderMarginCard(q){
  const gm=q.grossMargin, gmp=q.grossMarginPrev, om=q.opMargin, omp=q.opMarginPrev;
  return `<div class="revItem marginItem">
    <div class="dLabel">毛利率／營益率（${q.marginPeriod||q.period||''}）</div>
    <div class="marginRow">
      <span class="marginName">毛利率</span><span class="dVal marginVal">${gm||'—'}</span>${marginTrend(gm,gmp)}
    </div>
    <div class="marginRow">
      <span class="marginName">營益率</span><span class="dVal marginVal">${om||'—'}</span>${marginTrend(om,omp)}
    </div>
  </div>`;
}

function renderTechnicalSection(s,p){
  if(!technicalData || !technicalData.stocks) return '';
  const t=technicalData.stocks[s.code];
  if(!t) return `<div class="researchBlock"><div class="rbTitle">技術面補充（MA／相對大盤強弱）</div><div class="researchEmpty">尚無資料，等待下一次收盤後排程計算。</div></div>`;

  if(t.insufficientHistory){
    return `<div class="researchBlock">
      <div class="rbTitle">技術面補充（MA／相對大盤強弱）</div>
      <div class="researchEmpty">上櫃股票沒有官方逐日歷史API，正在每日累積價格資料中（目前累積 ${t.days||0} 天，需達20天才能算出完整均線與區間），累積完成前先以「AI建議」的支撐/壓力參考為主。</div>
    </div>`;
  }

  const rows=[];
  if(t.ma10!==undefined){
    const pos = !isNaN(p) ? (p>=t.ma10?'站上':'跌破') : '';
    rows.push({label:'10日均線(MA10)', val:t.ma10, extra:pos});
  }
  if(t.ma20!==undefined){
    const pos = !isNaN(p) ? (p>=t.ma20?'站上':'跌破') : '';
    rows.push({label:'20日均線(MA20)', val:t.ma20, extra:pos});
  }
  let rangeRow='';
  if(t.low20!==undefined && t.high20!==undefined){
    rangeRow+=`<div class="revItem"><div class="dLabel">20日區間</div><div class="dVal">${t.low20} ~ ${t.high20}</div></div>`;
  }
  if(t.low60!==undefined && t.high60!==undefined){
    rangeRow+=`<div class="revItem"><div class="dLabel">60日區間</div><div class="dVal">${t.low60} ~ ${t.high60}</div></div>`;
  }
  let maRow='';
  rows.forEach(r=>{
    maRow+=`<div class="revItem"><div class="dLabel">${r.label}</div><div class="dVal">${r.val}${r.extra?`　<span class="revSub" style="display:inline">(${r.extra})</span>`:''}</div></div>`;
  });

  let relHtml='';
  const rel5=t.relStrength5d, rel20=t.relStrength20d;
  if(rel5!==undefined || rel20!==undefined){
    const dirCls=v=>v>0?'up':(v<0?'down':'');
    relHtml=`<div class="revItem marginItem">
      <div class="dLabel">相對加權指數(TAIEX)強弱</div>
      <div class="marginRow"><span class="marginName">近5日</span><span class="dVal marginVal ${dirCls(rel5)}">${rel5!==undefined?fmtPct(rel5):'—'}</span></div>
      <div class="marginRow"><span class="marginName">近20日</span><span class="dVal marginVal ${dirCls(rel20)}">${rel20!==undefined?fmtPct(rel20):'—'}</span></div>
    </div>`;
  }

  let warnHtml='';
  const taiexChange5d = technicalData.taiex && technicalData.taiex.change5d;
  if(taiexChange5d!==undefined && taiexChange5d<-1 && t.change5d!==undefined && t.change5d<0){
    warnHtml=`<div class="srcList" style="color:var(--sell)">⚠ 大盤近5日同步下跌${fmtPct(taiexChange5d)}，這次拉回可能只是跟著大盤走弱，非個股獨立止跌訊號，進場前請一併確認大盤是否止穩。</div>`;
  }

  return `<div class="researchBlock">
    <div class="rbTitle">技術面補充（MA／相對大盤強弱）</div>
    <div class="revGrid">${maRow}${rangeRow}${relHtml}</div>
    ${warnHtml}
    <div class="srcList">資料來源：證交所歷史股價與加權指數（自動計算，非法人報告）</div>
  </div>`;
}

// 基本面：營收獲利／毛利率營益率
// 單季 EPS 年增率顯示：有明確數字（如 +287.7%、由虧轉盈）就標「年增」；
// 沒有可比較基期、只有說明文字（如「—（去年同期為虧損邊緣...）」）就直接顯示說明，不硬套「YoY —」；
// 完全沒資料就不顯示這行，避免出現空洞的「YoY —」。
function yoyEpsHtml(q){
  const y=(q.yoyEps||'').toString().trim();
  if(!y || y==='—') return '';
  const m=y.match(/^—\s*[（(](.+)[）)]\s*$/);
  if(m) return `<div class="revSub revNote">${m[1]}</div>`;
  return `<div class="revSub">年增 ${y}</div>`;
}
function qoqEpsHtml(q){
  const v=(q.qoqEps||'').toString().trim();
  if(!v || v==='—') return '';
  const m=v.match(/^—\s*[（(](.+)[）)]\s*$/);
  if(m) return `<div class="revSub revNote">${m[1]}</div>`;
  return `<div class="revSub">季增 ${v}</div>`;
}

function renderDetail(i){
  const view=document.getElementById('view');
  const s=stocks[i];
  const st=statusOf(s);
  const p=parseFloat(s.price), buy=parseFloat(s.buy), sell=parseFloat(s.sell), stop=parseFloat(s.stop);
  const support=parseFloat(s.support), resist=parseFloat(s.resist);

  const buyRefVal = !isNaN(buy)?buy:support;
  const buyRefLabel = !isNaN(buy)?'安全買進':'AI 建議買點';
  const sellRefVal = !isNaN(sell)?sell:resist;
  const sellRefLabel = !isNaN(sell)?'部分停利':'AI 建議賣點';
  const toBuy=pct(p,buyRefVal), toSell=pct(p,sellRefVal), toStop=pct(p,stop);
  const stretchVal = !isNaN(sellRefVal) ? stretchTargetOf(sellRefVal) : null;
  const toStretch = stretchVal!==null ? pct(p,stretchVal) : null;

  let rangeHtml='';
  const marks=[];
  // 前波高低點改用20日高低點（跟箱型分析同一個窗口），不用60日：60日常常會抓到規則改變前
  // 的舊區間極值（例如噴出前的崩跌低點、或轉強前很久以前的高點），跟「現在這個箱型」脫節，
  // 反而讓頭尾參考變得沒有意義。
  const tdBox=(technicalData && technicalData.stocks) ? technicalData.stocks[String(s.code||'').trim()] : null;
  const prevHigh20=tdBox && !isNaN(parseFloat(tdBox.high20)) ? parseFloat(tdBox.high20) : null;
  const prevLow20=tdBox && !isNaN(parseFloat(tdBox.low20)) ? parseFloat(tdBox.low20) : null;
  if(!isNaN(stop)) marks.push({v:stop,label:'跌深買進',cls:'stop'});
  if(!isNaN(buy)) marks.push({v:buy,label:'安全買進',cls:'buy'});
  else if(!isNaN(support)) marks.push({v:support,label:'AI支撐',cls:'sup'});
  if(!isNaN(sell)) marks.push({v:sell,label:'部分停利',cls:'sell'});
  else if(!isNaN(resist)) marks.push({v:resist,label:'AI壓力',cls:'res'});
  if(marks.length && !isNaN(p)){
    const vals=marks.map(m=>m.v).concat([p]);
    let min=Math.min(...vals), max=Math.max(...vals);
    const pad=(max-min)*0.15 || max*0.05 || 1;
    min-=pad; max+=pad;
    const posOf=v=>((v-min)/(max-min)*100);
    let marksHtml=marks.map(m=>`
      <div class="rangeMark ${m.cls}" style="left:${posOf(m.v)}%">
        <span class="rmLabel">${m.label}</span>
        <span class="rmVal">${m.v}</span>
      </div>`).join('');
    // 前波高點/前波低點只當作區間頭尾的固定參考標籤，不納入同一把尺的比例計算，
    // 避免因為距離現有買賣價太遠而把真正在操作的價位擠成一團
    const endsHtml=(prevLow20!==null || prevHigh20!==null) ? `
      <div class="rangeEnds">
        <span class="rangeEndLabel">${prevLow20!==null?`前波低點 ${prevLow20}`:''}</span>
        <span class="rangeEndLabel">${prevHigh20!==null?`前波高點 ${prevHigh20}`:''}</span>
      </div>` : '';
    rangeHtml=`
      <div class="rangeWrap">
        ${endsHtml}
        <div class="rangeTrack">
          ${marksHtml}
          <div class="rangeDot" style="left:${posOf(p)}%" title="現價 ${p}"></div>
        </div>
      </div>`;
  }

  const r=s.research||null;
  const hasTechnical = !!(r && r.technical) || !!(technicalData && technicalData.stocks && technicalData.stocks[s.code]);
  const hasFundamental = !!(r && r.revenue);
  const reportsCount = (r && r.reports) ? r.reports.length : 0;
  const hasReportsNews = reportsCount>0 || !!(r && r.news);

  let momentumNoteHtml='';
  if(st.cls==='st-stop'){
    momentumNoteHtml=`<div class="srcList" style="color:var(--deep); margin:10px 0 0">◆ 跌破深度加碼價不代表要出場——這裡假設你追蹤的都是已經自己確認過基本面的標的，超跌本身可能是機會而不是風險。系統只負責標出「到價了」，不做技術面抄底判斷；請自己確認基本面假設是否還成立（財報、產業展望有沒有變化），成立就當加碼機會，不成立就是真的該重新檢視部位了。</div>${stopBreadthWarningHtml(st.cls)}`;
  }else if(st.cls==='st-rebuy'){
    momentumNoteHtml=`<div class="srcList" style="color:var(--accent2); margin:10px 0 0">↻ 這檔股價已經噴出一段又拉回測10日均線，均線仍未走弱，屬於「噴出後找拉回買回」的典型時機，比追高進場更有紀律。</div>`;
  }else if(st.momentum==='first-stage'){
    momentumNoteHtml=`<div class="srcList" style="color:var(--sell); margin:10px 0 0">⚠ 這裡的「部分停利」只算「第一次減碼」的參考，不是全出訊號；均線仍多頭排列（未走弱）時不建議全出，續抱看突破箱型/前高訊號 <b>${st.stretch}</b>（部分停利價×1.15，對應噴出段的延伸幅度）。</div>`;
  }else if(st.momentum==='extended'){
    momentumNoteHtml=`<div class="srcList" style="color:var(--sell); margin:10px 0 0">🔥 股價已經漲到突破箱型/前高訊號 <b>${st.stretch}</b> 附近（約當部分停利價的+15%），這個位階漲多，可以考慮把減碼力道加重；如果均線之後真的走弱，就代表這波噴出結束了。</div>`;
  }

  const companyOverviewHtml = (r && r.overview) ? `
    <div class="researchBlock">
      <div class="rbTitle">公司產業概況</div>
      <div class="rbBody">${r.overview}</div>
    </div>` : '';

  const plLevelRows=[];
  if(!isNaN(buyRefVal)) plLevelRows.push({cls:'buy', label:buyRefLabel, val:buyRefVal, price:fmt(buyRefVal)||'—', dist:pctStr(toBuy)});
  if(!isNaN(sellRefVal)) plLevelRows.push({cls:'sell', label:sellRefLabel, val:sellRefVal, price:fmt(sellRefVal)||'—', dist:pctStr(toSell)});
  if(!isNaN(stop)) plLevelRows.push({cls:'stop', label:'跌深買進', val:stop, price:fmt(stop)||'—', dist:pctStr(toStop)});
  if(stretchVal!==null) plLevelRows.push({cls:'stretch', label:'突破箱型/前高訊號', val:stretchVal, price:stretchVal, dist:pctStr(toStretch)});
  // 「目前股價」不再固定放最上面，改成跟其他價位一起依價格高低排序，
  // 這樣才能一眼看出現價實際卡在哪兩個點位之間，並用外框特別標示出來。
  if(!isNaN(p)) plLevelRows.push({cls:'current', label:'目前股價', val:p, price:fmt(p)||'—'});
  plLevelRows.sort((a,b)=>b.val-a.val); // 由高到低排列，跟上方橫向尺規的價位高低方向一致
  const plRows = isNaN(p) ? [{cls:'current', label:'目前股價', price:'—'}, ...plLevelRows] : plLevelRows;
  const plListHtml=`<div class="plList">${plRows.map(row=>`
      <div class="plRow ${row.cls}">
        <div class="plLabelWrap">${row.cls!=='current'?'<span class="plDot"></span>':''}<span class="plLabel">${row.label}</span></div>
        <div class="plPrice">${row.price}</div>
        <div class="plDist">${row.dist||''}</div>
      </div>`).join('')}</div>`;

  const overviewHtml = `
    ${companyOverviewHtml}
    ${rangeHtml}
    ${plListHtml}
    ${momentumNoteHtml}
    <div class="srcList">「部分停利」是分批出場的參考點，不是全出訊號；只要均線仍多頭排列就建議保留基本部位續抱，「突破箱型/前高訊號」對應你歷史大波段單的幅度（部分停利價 × 1.15），均線走弱才是真正該全數出場的時候。這裡所有數字僅供個人觀察記錄，不構成買賣建議。</div>`;

  const technicalHtml = renderTechnicalNarrative(s) + renderTechnicalSection(s,p) || `<div class="researchEmpty">尚無技術面資料。</div>`;
  const fundamentalHtml = renderFundamentalTab(s);
  const reportsHtml = renderReportsNewsTab(s);

  const tabs=[
    {id:'overview', label:'總覽', html:overviewHtml, has:true},
    {id:'technical', label:'技術面', html:technicalHtml, has:hasTechnical},
    {id:'fundamental', label:'基本面', html:fundamentalHtml, has:hasFundamental},
    {id:'reports', label:'法人／新聞', html:reportsHtml, has:hasReportsNews, count:reportsCount},
  ];
  if(!tabs.some(t=>t.id===activeTab)) activeTab='overview';

  view.innerHTML=`
    <button class="backBtn" id="backBtn" type="button">‹ 返回列表</button>
    <div class="card">
      <div class="cardTop">
        <div class="ticker">${s.name||'(未命名)'}<span class="code">${s.code||''}</span>${s.sector?`<span class="sectorTag">${s.sector}</span>`:''}</div>
        <div class="status ${st.cls}">${st.label}</div>
      </div>
      ${detailPriceNoteHtml(s)}

      <div class="tabBar">
        ${tabs.map(t=>`<button type="button" class="tabBtn${t.id===activeTab?' active':''}" data-tab="${t.id}">${t.label}${t.count?`<span class="tabBadge">${t.count}</span>`:(t.has?'<span class="tabBadge">•</span>':'')}</button>`).join('')}
      </div>
      <div class="tabPane">
        ${tabs.find(t=>t.id===activeTab).html}
      </div>

      <div class="cardFoot">
        <span class="updated">${s.updated?('股價：'+s.updated):'尚未取得盤後股價'}</span>
      </div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click',()=>{ activeIndex=null; render(); window.scrollTo(0,savedListScrollY); });
  view.querySelectorAll('.tabBtn').forEach(btn=>{
    btn.addEventListener('click',()=>{ activeTab=btn.dataset.tab; render(); });
  });
}

document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('swingTrackerTheme', next); }catch(e){}
});
document.getElementById('brandTitle').addEventListener('click',()=>{
  activeIndex=null; render(); window.scrollTo(0,0);
});

render();
loadAutoData();
loadResearchData();
loadTechnical();
loadMacro();
loadNews();
</script>
</body>
</html>

name: probe-news (temporary)
on:
  push:
    branches: [probe-dates]
    paths: ['probe/probe_news.py', '.github/workflows/probe-news.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe_news.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/report.json || true
          git commit -m "probe report" || exit 0
          git push

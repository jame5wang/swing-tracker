name: news-fix test (temporary)
on:
  push:
    branches: [news-fix]
    paths: ['scripts/fetch_company_news.py', 'scripts/diag_news.py', '.github/workflows/news-fix-test.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_company_news.py
      - run: python3 scripts/diag_news.py
        env:
          DIAG_CODES: "2455,4971,3529,6739,3443,7750,2464,6922,8996,6451,7788,6515,3532"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/company_news.json data/news_dates.json data/news_diag.json
          git commit -m "test run output" || exit 0
          git push

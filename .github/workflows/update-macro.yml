name: 盤前國際總經簡報

on:
  schedule:
    # 台北時間週一到週五早上 8:00（UTC 00:00），台股9:00開盤前更新
    - cron: '0 0 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取國際指標並計算風險燈號
        continue-on-error: true
        run: python3 scripts/fetch_macro.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro.json
          git diff --quiet --cached && exit 0
          git commit -m "更新盤前國際總經簡報 $(date -u +'%Y-%m-%d')"
          # 其他排程可能同時推送到 main（2026-09-29 曾因同時觸發而推送失敗），失敗時先 rebase 再重試
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*15))
          done
          echo "::error::推送失敗（重試5次仍衝突）"
          exit 1

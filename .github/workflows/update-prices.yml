name: 更新台股盤後收盤價

on:
  schedule:
    # 每個交易日台北時間下午 5:00（UTC 09:00）執行，週六日跳過
    - cron: '0 9 * * 1-5'
    # 安全網：30分鐘後（台北時間下午 5:30）再跑一次。抓取腳本本身已有重試機制，
    # 但若證交所/櫃買中心當下真的整個掛掉太久，這次會再補抓一次；
    # 若5:00那次已經成功，這次資料沒有變化就不會產生新的commit，不會有副作用。
    - cron: '30 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取證交所盤後資料（上市）
        run: python3 scripts/fetch_prices.py

      - name: 抓取櫃買中心盤後資料（上櫃）
        run: python3 scripts/fetch_prices_otc.py

      - name: 計算技術面指標（MA10/MA20、20日60日高低點、相對大盤強弱）
        run: python3 scripts/fetch_technical.py

      - name: 用技術指標資料校正收盤價（防止證交所批次API發布延遲導致收盤價停在前一交易日）
        run: python3 scripts/reconcile_prices.py

      - name: 更新單月營收（公開資訊觀測站 MOPS 官方資料）
        run: python3 scripts/fetch_revenue.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/prices_otc.json data/technical.json data/research.json
          git diff --quiet --cached || git commit -m "更新盤後收盤價與技術指標 $(date -u +'%Y-%m-%d')"
          git push

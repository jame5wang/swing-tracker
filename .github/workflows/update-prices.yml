name: 更新台股盤後收盤價

on:
  schedule:
    # 每個交易日台北時間下午 3:00（UTC 07:00）執行，週六日跳過
    - cron: '0 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取證交所盤後資料（上市）
        run: python3 scripts/fetch_prices.py

      - name: 抓取櫃買中心盤後資料（上櫃）
        run: python3 scripts/fetch_prices_otc.py

      - name: 計算技術面指標（MA10/MA20、20日60日高低點、相對大盤強弱）
        run: python3 scripts/fetch_technical.py

      - name: 更新單月營收（公開資訊觀測站 MOPS 官方資料）
        run: python3 scripts/fetch_revenue.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/prices_otc.json data/technical.json data/research.json
          git diff --quiet --cached || git commit -m "更新盤後收盤價與技術指標 $(date -u +'%Y-%m-%d')"
          git push

name: probe-margin (temporary)
on:
  push:
    branches: [probe-margin]
    paths: ['probe/probe_margin.py', '.github/workflows/probe-margin.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe_margin.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe/margin_report.json || true
          git commit -m "probe margin report" || exit 0
          git push

name: 抓取原始財經新聞（供每日AI彙整使用）

on:
  schedule:
    # 台北時間週一到週五早上 7:00（UTC 前一天 23:00），提早跑讓 7:30 的 AI 彙整排程有資料可整理
    - cron: '0 23 * * 0-4'
  workflow_dispatch: {}
  # 備援觸發：GitHub 排程會延遲（2026-10-29 起都拖到 10～11 點才跑，07:30 的每日彙整因此找不到
  # 原始新聞而略過），Claude 排程任務每個交易日 06:53 直接觸發；呼叫不了 GitHub API 時改推送
  # 這個檔案觸發。詳見 update-prices.yml 的說明。
  push:
    branches: [main]
    paths: ['.github/kick/fetch-news-raw']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取財經新聞頭條（原始RSS，未經AI彙整）
        continue-on-error: true
        run: python3 scripts/fetch_news.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/
          git diff --quiet --cached && exit 0
          git commit -m "抓取原始財經新聞 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*15))
          done
          echo "::error::推送失敗（重試5次仍衝突）"
          exit 1

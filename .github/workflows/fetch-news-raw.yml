name: 抓取原始財經新聞（供每日AI彙整使用）

on:
  schedule:
    # 台北時間週一到週五早上 7:00（UTC 前一天 23:00），提早跑讓 7:30 的 AI 彙整排程有資料可整理
    - cron: '0 23 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取財經新聞頭條（原始RSS，未經AI彙整）
        run: python3 scripts/fetch_news.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/
          git diff --quiet --cached || git commit -m "抓取原始財經新聞 $(date -u +'%Y-%m-%d')"
          git push

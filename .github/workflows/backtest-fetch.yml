name: 回測用歷史資料抓取（一次性）

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取近13個月完整日K（供回測引擎使用）
        run: python3 scripts/fetch_backtest_history.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_history.json
          git diff --quiet --cached && exit 0
          git commit -m "抓取回測用歷史資料 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*15))
          done
          exit 1
